# Refreshes the SEO layer of the storefront every 30 minutes:
#   products.json (snapshot the SPA seeds from) · /p/<slug>/ static product pages ·
#   sitemap.xml · the pre-rendered grid between the IBI:SSR markers in index.html.
# Commits only when the catalogue actually changed; GitHub Pages redeploys on push.
# Run it by hand from the Actions tab (workflow_dispatch) after listing something new.
name: Catalogue snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build catalogue snapshot & product pages
        run: node tools/build-catalogue.js

      - name: Commit & push if the catalogue changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "catalogue snapshot: refresh product pages, grid & sitemap"
            git push
          fi
